<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo-j</title>
    <link rel="stylesheet" href="src/style.css">
  </head>
  <body>
    <aside>
      <h3>MY TODO</h3>
      <div id="projects-list"></div>
      <button id="add-project">Add Project</button>
    </aside>

    <main>
      <h3 id="project-title"></h3>
      <div id="todo-container"></div>
      <button id="add-todo">Add Todo</button>
    </main>

    <div id="todo-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Add New Todo</h2>
          <button class="close-modal">&times;</button>
        </div>
        <form id="todo-form">
          <div class="form-group">
            <label for="todo-title">Title *</label>
            <input 
              type="text" 
              id="todo-title" 
              placeholder="Enter todo title" 
              required
              maxlength="100"
            >
            <span class="error-message" id="title-error"></span>
          </div>

          <div class="form-group">
            <label for="todo-description">Description</label>
            <textarea 
              id="todo-description" 
              rows="3" 
              placeholder="Enter description (optional)"
              maxlength="500"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="todo-due-date">Due Date</label>
            <input type="date" id="todo-due-date">
          </div>

          <div class="form-group">
            <label for="todo-priority">Priority</label>
            <select id="todo-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" id="cancel-todo">Cancel</button>
            <button type="submit" class="btn-submit">Add Todo</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
